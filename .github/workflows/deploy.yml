# Builds the site on every push to main and publishes it to GitHub Pages.
# The repository's Pages source must be set to "GitHub Actions".
name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Each job declares only what it needs; nothing is granted workflow-wide.
permissions: {}

# One deployment at a time; let an in-flight one finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Third-party action, so it is pinned to a commit. The pnpm version
      # itself comes from package.json#packageManager.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every `ts twoslash` block is type-checked during the build, so this is
      # also the test suite. `build` already raises the heap limit it needs.
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
